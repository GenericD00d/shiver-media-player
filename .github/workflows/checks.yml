# Checks only: releases are published from one machine (RELEASING.md). Nothing here needs a
# secret, so it is safe to run on pull requests from anyone. Actions are pinned to commit SHAs
# (version in the comment) and Bun to an exact version.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Docs, versions, tests and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Docs follow the Shiver standard
        run: python3 scripts/check-docs.py
      - name: Versions agree
        run: python3 scripts/check-version.py
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Sharkord's SDK, at the release the family is tested against
        run: bun run setup
      - name: Types
        run: scripts/check-types.sh
