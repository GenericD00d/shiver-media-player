# The dependency audit: on every push and pull request, and weekly, so an advisory published while
# nothing is pushed still shows up (docs/standards.md, Security baseline rule 4). A failed scheduled
# run emails the owner. Nothing here needs a secret.
name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # reads the lockfile only
      - run: bun audit
